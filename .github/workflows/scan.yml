name: scan

# Self-driving market scan. Runs daily after NSE publishes the day's
# end-of-day files, and on manual trigger. Every run ingests whatever trading
# days are missing — the full ~90-day backfill on a fresh database (a few
# minutes), then normally just the new day — so a missed or early run is
# simply caught up by the next one.
on:
  schedule:
    # 14:13 UTC = 19:43 IST. NSE's bhavcopy appears in the evening after the
    # 15:30 IST close. An off-the-hour minute avoids GitHub's top-of-hour
    # scheduling backlog (runs here have been starting hours late at :00).
    - cron: "13 14 * * *"
  workflow_dispatch:      # manual "Run workflow" button
    inputs:
      probe:
        description: "Probe only: check NSE's files are reachable from GitHub (no database used)"
        type: boolean
        default: false

concurrency:
  group: scan
  cancel-in-progress: false   # never interrupt an in-flight scan

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # a full backfill is ~150 small downloads
    steps:
      # Fail in seconds with an actionable message instead of a Python
      # traceback after a full pip install. An empty value here means the
      # secret is missing from *Repository secrets* (a Variable, an
      # Environment secret, or a Codespaces/Dependabot secret won't reach it).
      - name: Check DATABASE_URL secret
        if: ${{ !inputs.probe }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error title=DATABASE_URL secret is missing::Add it at ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/settings/secrets/actions → 'New repository secret', name DATABASE_URL, value = your Neon connection string (postgresql://...?sslmode=require)."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install dependencies
        run: pip install -r worker/requirements.txt

      - name: Run scan
        working-directory: worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -u run.py ${{ inputs.probe && '--probe' || '' }}
